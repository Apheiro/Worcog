[package]
name = "worklog"
version = "0.6.0"
edition = "2021"

[lib]
name = "worklog_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-opener", "dep:rfd", "dep:mime_guess"]

[[bin]]
name = "worklog"
path = "src/main.rs"
required-features = ["desktop"]

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = [], optional = true }
tauri-plugin-opener = { version = "=2.7.2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
rfd = { version = "0.17.2", optional = true }
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
url = "2"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "native-tls"] }
semver = "1"
sha2 = "0.10"

mime_guess = { version = "2", optional = true }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }

[dev-dependencies]
tempfile = "3"
