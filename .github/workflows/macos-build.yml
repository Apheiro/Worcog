name: macOS build

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build and attach assets to (empty = artifacts only)
        required: false
        type: string
        default: ''
      source_ref:
        description: Optional source ref override (empty = selected workflow branch)
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      release_tag:
        description: Existing release tag to build and attach assets to
        required: true
        type: string
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: macos-${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      APPLE_SIGNING_IDENTITY: '-'
    outputs:
      artifact_name: worcog-macos-universal-v${{ steps.versions.outputs.version }}
      binary_file: ${{ steps.assets.outputs.binary_file }}
      binary_sha256: ${{ steps.assets.outputs.binary_sha256 }}
    steps:
      - name: Check out the selected tag or ref
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_ref || (github.event_name == 'workflow_dispatch' && github.ref) || (inputs.release_tag && format('refs/tags/{0}', inputs.release_tag)) || github.ref }}
          persist-credentials: false
      - name: Install pnpm from packageManager
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: pnpm
      - name: Select stable Rust and both macOS architectures
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate application versions and release tag
        id: versions
        env:
          RELEASE_TAG: ${{ inputs.release_tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: pnpm release:validate
      - name: Check that the target release already exists
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release view "$RELEASE_TAG" --json tagName
      - name: Build portable universal macOS app
        run: pnpm tauri build --target universal-apple-darwin --bundles app --config '{"bundle":{"active":true}}' -- --locked
      - name: Prepare portable app ZIP
        id: assets
        env:
          APP_VERSION: ${{ steps.versions.outputs.version }}
        run: |
          set -euo pipefail
          app="$GITHUB_WORKSPACE/src-tauri/target/universal-apple-darwin/release/bundle/macos/Worcog.app"
          test -d "$app"
          assets="$RUNNER_TEMP/worcog-assets"
          mkdir -p "$assets"
          filename="worcog-v${APP_VERSION}-macos-universal.zip"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$assets/$filename"
          hash=$(shasum -a 256 "$assets/$filename" | cut -d ' ' -f 1)
          echo "directory=$assets" >> "$GITHUB_OUTPUT"
          echo "binary_file=$filename" >> "$GITHUB_OUTPUT"
          echo "binary_sha256=$hash" >> "$GITHUB_OUTPUT"
      - name: Upload macOS asset
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: worcog-macos-universal-v${{ steps.versions.outputs.version }}
          path: ${{ steps.assets.outputs.directory }}/*.zip
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  publish:
    needs: build
    if: inputs.release_tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download macOS asset
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: macos-assets
      - name: Verify ZIP and attach it to the existing release
        working-directory: macos-assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          BINARY_FILE: ${{ needs.build.outputs.binary_file }}
          BINARY_SHA256: ${{ needs.build.outputs.binary_sha256 }}
        run: |
          printf '%s  %s\n' "$BINARY_SHA256" "$BINARY_FILE" | sha256sum --check -
          gh release view "$RELEASE_TAG" --json tagName
          gh release upload "$RELEASE_TAG" "$BINARY_FILE" --clobber
